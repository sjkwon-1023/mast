# CI (stage 22 — 계획 v2 13장 "처음부터 x64 + ARM64 CI 빌드").
#
# job 구성과 러너 선택 근거. `push` 트리거는 `main` 과 `v*` 태그뿐이라(아래 `on:`),
# 기능 브랜치 push 는 PR 을 열기 전까지 어느 job 도 돌지 않는다.
# - gates (ubuntu, 모든 PR + main/v* push): Linux 게이트 — core/remote 테스트, Cargo.lock
#   검사, 프런트 빌드+vitest, Secure Remote 번들 감사.
# - windows-gates (windows, 모든 PR + main/v* push): Windows 타깃 컴파일 게이트 — x64·ARM64
#   clippy 와 x64 workspace check, 그리고 x64 네이티브 테스트(mast-remote, 글루
#   secure_remote). ring 같은 네이티브 TLS 스택의 build script 는 check 에서도 C 컴파일을
#   하며 MSVC C 툴체인(lib.exe/clang)을 요구한다 (2026-09 확인) — ubuntu 에서 Windows
#   타깃으로 도는 예전 방식은 이 의존성과 함께 성립하지 않는다. 공개 저장소의 표준
#   Windows 러너는 무료이고, 러너 이미지에 ARM64 도구와 Clang 이 들어 있다.
# - windows-artifacts (windows, 수동/태그만): 릴리스 빌드(x64 + ARM64 아티팩트)와
#   Release 첨부. 매 push 가 아니라 ARM64 실기 테스트(23단계)용 산출이 목적이다.
#
# 과거에는 "check-family 는 링크를 하지 않아 MSVC import 라이브러리가 필요 없다"는
# 전제로 ubuntu 한 job 에 Windows 타깃 clippy/check 를 넣었다. 전제 자체는 여전히
# 유효하지만(링크는 안 한다) C 의존의 빌드 스크립트가 크로스 C 툴체인을 요구해 깨졌다.

name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# 기본은 읽기 전용 — 쓰기가 필요한 job(릴리스 첨부)만 job 단위로 넓힌다.
permissions:
  contents: read

jobs:
  gates:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            apps/mast/package-lock.json
            apps/spike/package-lock.json

      - name: Core tests
        run: cargo test -p mast-core

      - name: Remote crate tests
        run: cargo test -p mast-remote

      # 락을 손으로 고친 뒤 조용히 어긋나는 걸 막는다 — 위 cargo 단계가 Cargo.lock 을
      # 갱신했다면 여기서 red 가 된다.
      - name: Cargo.lock is up to date
        run: git diff --exit-code -- Cargo.lock

      - name: mast frontend (build + vitest)
        working-directory: apps/mast
        run: |
          npm ci
          npm run build
          npx vitest run

      # Secure Remote 폰 번들은 빌드 산출물이라 소스 리뷰로는 지켜지지 않는다 — 실제로
      # 나온 `dist-secure-remote` 를 검사한다 (번들 밖으로 나가면 실패). self-test 는 같은
      # 감사가 오염된 복사본을 실제로 거부하는지 확인해, 게이트가 stub 이 아님을 증명한다.
      - name: Secure Remote bundle audit
        working-directory: apps/mast
        run: |
          npm run audit:secure-remote
          npm run audit:secure-remote:self-test

      - name: spike frontend (build + vitest)
        working-directory: apps/spike
        run: |
          npm ci
          npm run build
          npx vitest run

  windows-gates:
    # 모든 PR + main/v* 태그 push 의 Windows 타깃 컴파일 게이트. Linux 크로스로는 ring 의
    # C 빌드가 불가능하므로 여기서 돈다 (파일 상단 주석 참조). ARM64 는 크로스 check 라
    # 링크가 없어도 되고, 빌드 스크립트가 요구하는 clang 은 러너 이미지에 있다.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: x86_64-pc-windows-msvc,aarch64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2

      - name: Clippy (x64 Windows target)
        run: cargo clippy --workspace --all-targets --target x86_64-pc-windows-msvc -- -D warnings

      - name: Clippy (ARM64 Windows target)
        run: cargo clippy --workspace --all-targets --target aarch64-pc-windows-msvc -- -D warnings

      - name: Workspace check (x64 Windows target)
        run: cargo check --workspace --target x86_64-pc-windows-msvc

      # Secure Remote 의 런타임 검증은 Linux 테스트만으로 충분하지 않다. WT 서버 통합
      # 테스트(`crates/mast-remote/tests/wt.rs`)는 unix 전용이라 Windows 에서는
      # `#![cfg(unix)]` 로 비어 버린다 — 이 러너의 clippy 도 이 파일의 코드를 보지 못한다.
      # 제품이 도는 Windows 에서 실제로 도는 것은 라이브러리 단위 테스트와 HTTP 서버
      # 통합 테스트, 그리고 글루의 `secure_remote` 테스트(실제 UDP 바인드·해제와 방화벽
      # 판정)다. ARM64 바이너리는 이 러너에서 실행할 수 없어 x64 에서만 돈다.
      - name: Markdown save tests (x64 Windows, native)
        run: cargo test -p mast-core --target x86_64-pc-windows-msvc document::tests

      - name: Secure remote crate tests (x64 Windows, native)
        run: cargo test -p mast-remote --target x86_64-pc-windows-msvc

      - name: Secure remote glue tests (x64 Windows, native)
        run: cargo test -p mast-app --target x86_64-pc-windows-msvc secure_remote

  windows-artifacts:
    # 릴리스 전용 러너 — 매 push 가 아니라 수동/태그에서만. ARM64 실기 테스트용
    # 아티팩트 산출이 목적이다 (23단계). 태그 트리거일 때는 추가로 GitHub Release 에 첨부한다.
    # (공개 저장소의 표준 Windows 러너는 무료라 "2x 단가" 전제는 더 이상 유효하지 않다 —
    # 트리거를 좁게 두는 이유는 비용이 아니라 매 push 에 릴리스 빌드가 필요하지 않기 때문이다.)
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    # job 단위 최소 권한 — Release 첨부(softprops/action-gh-release)에만 필요, gates job 에는 안 준다.
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64-pc-windows-msvc, aarch64-pc-windows-msvc]
        include:
          - target: x86_64-pc-windows-msvc
            asset_name: mast-x64.exe
          - target: aarch64-pc-windows-msvc
            asset_name: mast-arm64.exe
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/mast/package-lock.json

      - name: Build mast (release, no bundle)
        working-directory: apps/mast
        run: |
          npm ci
          npm run tauri build -- --target ${{ matrix.target }} --no-bundle

      # 이 레포의 Rust 테스트 중 `mast-app`(글루)의 것은 Windows 타깃에서만 컴파일된다
      # — ubuntu 의 gates job 은 `mast-core`/`mast-remote` 만 돌린다. 그래서 래퍼 argv 계약 테스트가
      # 시작 표식 도입(d21d9a8) 이후 조용히 낡아 있었다. x64 레그에서만 실행한다
      # (ARM64 는 크로스 빌드라 이 러너에서 실행 자체가 불가능하다).
      - name: Glue tests (x64 only — ARM64 binaries cannot run here)
        if: matrix.target == 'x86_64-pc-windows-msvc'
        run: cargo test --workspace --target ${{ matrix.target }}

      - uses: actions/upload-artifact@v4
        with:
          name: mast-${{ matrix.target }}
          # 워크스페이스 루트 target 디렉터리 (레포 루트가 cargo 워크스페이스다).
          path: target/${{ matrix.target }}/release/mast-app.exe
          if-no-files-found: error

      # 태그 트리거 전용: Release 에 올릴 타깃별 명확한 이름의 복사본.
      # workflow_dispatch 실행은 위 artifact 업로드(원본 파일명)만 하고 여기서 끝난다.
      - name: Copy release asset
        if: startsWith(github.ref, 'refs/tags/v')
        run: cp target/${{ matrix.target }}/release/mast-app.exe target/${{ matrix.target }}/release/${{ matrix.asset_name }}

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: target/${{ matrix.target }}/release/${{ matrix.asset_name }}
