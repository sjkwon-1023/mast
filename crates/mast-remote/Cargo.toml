[package]
name = "mast-remote"
version = "0.1.0"
edition = "2021"

[dependencies]
# 상태 스냅샷(`/api/state`)과 탭·세션 조회의 출처. 서버는 코어의 모델을 읽기만 한다.
mast-core = { path = "../mast-core" }
# 스냅샷 직렬화 — 데스크톱의 `state-changed` 와 같은 JSON 을 그대로 내보낸다.
serde_json = "1"
# 요청 헤드 파서만 빌려 쓴다 — accept 루프·스레드·응답 쓰기는 이 크레이트가 직접 한다
# (ADR-0016 결정 3: HTTP 표면에는 async 런타임을 들이지 않는다).
httparse = "1"
# 토큰용 CSPRNG. 0.3 은 Windows 에서 ProcessPrng, unix 에서 getrandom(2) 를 쓰므로
# 플랫폼 분기를 우리가 들고 있지 않아도 된다.
getrandom = "0.3"
base64 = "0.22"
# Secure Remote(WebTransport/HTTP3) 어댑터. quinn·rustls·http 를 재수출하므로 직접
# 의존을 늘리지 않는다. `ring` 백엔드로 고정하는 이유: aws-lc-sys 는 Windows 빌드에
# cmake·NASM 을 요구하는데 이 레포는 그 둘을 전제하지 않는다.
web-transport-quinn = { version = "0.12", default-features = false, features = ["ring"] }
# WebTransport 런타임. 세션 하나와 폰 한 대가 전부라 current_thread 로 충분하다.
# macros 는 `select!`, sync 는 oneshot/mpsc, time 은 타임아웃·idle 타이머다.
tokio = { version = "1", default-features = false, features = [
    "rt",
    "macros",
    "net",
    "time",
    "sync",
] }
# ECDSA P-256 자체 서명 인증서 생성. pem 은 쓰지 않으므로 끈다.
rcgen = { version = "0.14", default-features = false, features = ["ring"] }
# 인증서 DER 의 SHA-256 — QR 에 싣는 값이자 WebTransport 가 검증하는 값이다.
sha2 = "0.10"
# 인증서 notBefore/notAfter 계산. rcgen 이 같은 크레이트를 쓰므로 버전이 통일된다.
time = { version = "0.3", features = ["std"] }

[dev-dependencies]
# 토큰 파일 테스트의 임시 디렉터리용 (mast-core 의 persist 테스트와 같은 용도).
tempfile = "3"
# 테스트의 fake `SessionHost` 가 코어의 `spawn_shell` 시그니처를 그대로 구현하려면
# 반환 타입을 이름으로 부를 수 있어야 한다.
anyhow = "1"
# WebTransport 클라이언트 테스트가 `ConnectRequest` 에 넘길 Url 을 만든다.
url = "2"
# 로컬 바인드 주소를 고르는 테스트 전용 QUIC 클라이언트(tests/wt.rs)의 TLS 설정.
# `web-transport-quinn` 이 re-export 하지 않는 rustls 타입을 직접 부른다 — ring 은
# 이미 그래프에 있고(웹 전송 백엔드), aws-lc-sys 를 새로 끌어오지 않도록 막는다.
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
