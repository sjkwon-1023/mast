[package]
name = "mast-remote"
version = "0.1.0"
edition = "2021"

[dependencies]
# 상태 스냅샷(`/api/state`)과 탭·세션 조회의 출처. 서버는 코어의 모델을 읽기만 한다.
mast-core = { path = "../mast-core" }
# 스냅샷 직렬화 — 데스크톱의 `state-changed` 와 같은 JSON 을 그대로 내보낸다.
serde_json = "1"
# 요청 헤드 파서만 빌려 쓴다 — accept 루프·스레드·응답 쓰기는 이 크레이트가 직접 한다
# (ADR-0016 결정 3: async 런타임을 들이지 않는다).
httparse = "1"
# 토큰용 CSPRNG. 0.3 은 Windows 에서 ProcessPrng, unix 에서 getrandom(2) 를 쓰므로
# 플랫폼 분기를 우리가 들고 있지 않아도 된다.
getrandom = "0.3"
base64 = "0.22"

[dev-dependencies]
# 토큰 파일 테스트의 임시 디렉터리용 (mast-core 의 persist 테스트와 같은 용도).
tempfile = "3"
# 테스트의 fake `SessionHost` 가 코어의 `spawn_shell` 시그니처를 그대로 구현하려면
# 반환 타입을 이름으로 부를 수 있어야 한다.
anyhow = "1"
