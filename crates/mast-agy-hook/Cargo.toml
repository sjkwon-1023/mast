[package]
name = "mast-agy-hook"
version = "0.1.0"
edition = "2021"

# Antigravity CLI(agy) 훅. 설치 스크립트가 `<dest>\bin`에 두고 hooks.json 이 PATH 이름으로 부른다.
# 판정 규칙의 원본은 WSL 쪽 `scripts/wsl/mast-agy-hook.sh` 다.
[target.'cfg(windows)'.dependencies]
# CONOUT$ 열기·VT 모드 전환에만 쓴다. 워크스페이스가 이미 쓰는 0.61 을 맞춰 그래프에 크레이트를 늘리지 않는다.
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_IO",
] }
