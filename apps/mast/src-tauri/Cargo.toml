# mast 데스크톱 앱 (Tauri v2 글루) — bin 전용 크레이트.
# 로직은 mast-core 에 있고 여기는 상태 배선·커맨드·sink 글루만 둔다.

[package]
name = "mast-app"
version = "1.0.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
mast-core = { path = "../../../crates/mast-core" }
# 원격 표면(LAN 폴링)의 HTTP 서버. 소켓·파싱·인증·라우팅이 전부 저쪽에 있고 이
# 크레이트는 설정·토큰 경로·자산 콜백·로그 싱크만 넘긴다 (`remote` 모듈 doc) —
# src-tauri 는 Linux 개발기에서 컴파일되지 않아 여기 둔 로직은 `cargo test` 로 한
# 줄도 돌릴 수 없기 때문이다.
mast-remote = { path = "../../../crates/mast-remote" }

# 메모리 워치독 (계획 16단계 C-2) — Toolhelp 자손 스캔 + PrivateUsage 조회.
# 직접 의존 + features 명시 (계획 0장 — Cargo.lock 전이 의존은 feature 활성이
# 아니다). Win32_System_Threading 은 OpenProcess/PROCESS_QUERY_LIMITED_INFORMATION
# 의 실제 위치라 계획의 3종에 추가로 필요하다.
[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Networking_WinHttp",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_ProcessStatus",
    # 로그 타임스탬프의 로컬 시각 (GetLocalTime) — 시간 크레이트를 들이지 않기 위해.
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
] }
# 워크스페이스 폴더 선택 대화상자 (Windows 네이티브 IFileDialog). Windows 백엔드는
# windows-sys 0.61(위와 같은 버전) 위의 순수 Rust 구현이라 C 툴체인·아키텍처별
# 바이너리가 없고 ARM64 크로스 빌드에도 추가 준비물이 없다. default features
# (xdg-portal·wayland)는 Linux 백엔드 전용이라 끈다.
rfd = { version = "0.17", default-features = false }
# needsInput OS 토스트 (v0.3.7) — WinRT 토스트 API 의 얇은 래퍼를 **직접** 부른다.
# v0.3.6 까지는 `tauri-plugin-notification` 을 거쳤는데, 그 플러그인의 Windows 경로가
# `tauri::async_runtime::spawn(async move { let _ = notification.show(); })` 로 발송
# 오류를 통째로 삼켜(2.3.3 `desktop.rs:216`) "토스트가 안 뜬다"의 원인을 앱에서 볼 수
# 없었다. 같은 크레이트가 그 사슬의 맨 끝(notify-rust → 여기)이라 의존 그래프는
# 오히려 줄고, 발송 AUMID 도 우리 상수 하나로 확정된다 (`app_identity` 모듈 doc).
# 순수 Rust WinRT 바인딩이라 C 툴체인·아키텍처별 바이너리가 없다 — ARM64 크로스
# 빌드에 추가 준비물이 없다 (rfd 와 같은 판단).
tauri-winrt-notification = "0.7"
# 셸 앱 신원(AUMID) 등록 — `app_identity` 모듈. 토스트가 뜨려면 시작 메뉴 .lnk 에
# System.AppUserModel.ID 를 심어야 하는데 그건 COM(IShellLink·IPropertyStore) 이라
# windows-sys 의 raw FFI 로는 vtable 을 손으로 깎아야 한다 — COM 래퍼가 있는
# `windows` 크레이트를 쓴다. 0.61 은 `tauri-winrt-notification` 이 이미 끌고 오는
# 버전과 같아 그래프에 크레이트가 새로 늘지 않는다 (feature 는 가산이라 아래 목록만
# 추가로 켜진다).
windows = { version = "0.61", features = [
    "Win32_Foundation",
    # INetFwPolicy2·INetFwRule — 방화벽 규칙을 **일반 권한**으로 열거해 판정하는
    # `firewall` 모듈. netsh/PowerShell 출력 파싱을 쓰지 않는 이유는 느린 것에 더해
    # 문구가 로캘(한국어)에 따라 바뀌기 때문이다.
    "Win32_NetworkManagement_WindowsFirewall",
    # PKEY_AppUserModel_ID 는 windows-rs 에서 여기 산다 (Shell 이 아니다).
    "Win32_Storage_EnhancedStorage",
    # IShellLinkW::GetPath 가 받는 WIN32_FIND_DATAW.
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    # IEnumVARIANT(규칙 열거)가 여기 살고, `VARIANT` 타입 **자체**가
    # `Win32_System_Com` + 이 feature 로 게이트돼 있다 (windows-rs 0.61.3
    # `Win32/System/Variant/mod.rs:742`) — Variant 만 켜서는 존재하지 않는다.
    "Win32_System_Ole",
    # ShellExecuteExW(승격 netsh 실행)가 이 feature 로 게이트돼 있다: SHELLEXECUTEINFOW
    # 가 HKEY 필드를 들고 있어서다 (같은 크레이트 `Win32/UI/Shell/mod.rs:4360`).
    # 레지스트리를 직접 쓰지는 않는다.
    "Win32_System_Registry",
    # GetLocalTime — 토스트 진단 로그(`commands::notify_toast`)의 타임스탬프.
    # 사용자가 "몇 시에 토스트를 못 봤다"와 대조하는 파일이라 epoch 초가 아니라
    # 현지 시각으로 남긴다.
    "Win32_System_SystemInformation",
    # WaitForSingleObject·GetExitCodeProcess — 승격된 netsh 의 종료를 기다려 exit code
    # 를 로그에 남긴다 (성공 판정은 재감지가 한다).
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_Shell",
    "Win32_UI_Shell_PropertiesSystem",
    # ShellExecuteW(터미널 링크 열기 — ADR-0012)가 이 feature 아래에 산다: 함수 자체가
    # `Win32_UI_WindowsAndMessaging` 으로 게이트돼 있다(SHOW_WINDOW_CMD 때문). 지금은
    # wry/tao 가 같은 feature 를 켜서 우연히 컴파일되지만, 우리 코드가 쓰는 것은 우리가
    # 명시한다 (이 파일 상단의 "직접 의존 + features 명시" 규율).
    "Win32_UI_WindowsAndMessaging",
] }
